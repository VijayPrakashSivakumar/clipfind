<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipFind</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="brand">ClipFind</div>
    </header>

    <section class="card" id="current-video-card" hidden>
      <h2 id="current-video-title">YouTube video</h2>
      <p id="current-video-status" class="muted">Not on a YouTube video page</p>
      <div class="button-row">
        <button id="btn-analyze" class="btn btn-primary" disabled>Find Everything</button>
        <button id="btn-open-panel" class="btn btn-outline" disabled>Open Discovery Panel</button>
      </div>
      <p id="current-video-count" class="muted small"></p>
    </section>

    <section class="card" id="recent-card" hidden>
      <h2>Recent Discoveries</h2>
      <div id="recent-list" class="recent-list">None yet.</div>
      <button id="btn-clear-history" class="btn btn-text small">Clear history</button>
    </section>

    <footer class="popup-footer">
      <p class="muted small">ClipFind &middot; Manifest V3</p>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
